[package]
name = "docbro"
version = "0.1.0"
description = "Word processor app built with Tauri"
license = "MIT"
edition = "2021"

[lib]
name = "docbro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
dirs = "7"
getrandom = "0.3"
percent-encoding = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# signals for the Claude Code process group (SIGTERM, then SIGKILL)
libc = "0.2"

# tiny_http 0.12.0 with one fix: a dropped request no longer allocates the body size the
# client claimed (see vendor/tiny_http/VENDORED.md)
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
